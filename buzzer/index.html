<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16122b" />
  <link rel="icon" type="image/png" href="./img/logo.png" />
  <title>الأشبال — مسابقات لحظية</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <h1 class="brand-title"><img class="brand-logo" src="./img/logo.png" alt="الأشبال" /></h1>
      <p class="sub">مسابقات لحظية — مَن يضغط أولاً؟</p>
    </header>

    <section class="roles">
      <a class="role" href="./host.html">
        <span class="emoji"><img src="./img/icon-host.png" alt="" /></span>
        <div>
          <h2>مضيف</h2>
          <p>أنشئ غرفة، اعرض الأسئلة، جهّز الباصرة وادِّ النقاط.</p>
        </div>
      </a>
      <a class="role" href="./player.html">
        <span class="emoji"><img src="./img/icon-player.png" alt="" /></span>
        <div>
          <h2>لاعب</h2>
          <p>ادخل بالكود من موبايلك والعب بكل الأوضاع.</p>
        </div>
      </a>
      <a class="role" href="./display.html">
        <span class="emoji"><img src="./img/icon-display.png" alt="" /></span>
        <div>
          <h2>شاشة العرض</h2>
          <p>اعرضها على التلفزيون — يتابع الجمهور النتائج لحظياً.</p>
        </div>
      </a>
    </section>

    <footer>الترتيب يُحسم من ساعة السيرفر — عادل للجميع.</footer>
  </main>
</body>
</html>
