<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1030" />
  <title>🙋 اللاعب — الباصرة</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main class="wrap">
    <!-- شاشة الدخول -->
    <section id="join">
      <header class="brand">
        <div class="logo">🔔</div>
        <h1>ادخل المسابقة</h1>
        <p class="sub"><a href="./index.html" style="color:var(--muted)">← الرئيسية</a></p>
      </header>
      <div class="card">
        <label for="nameInput">اسمك</label>
        <input id="nameInput" type="text" placeholder="اكتب اسمك" maxlength="24" autocomplete="off" />
        <label for="codeInput">كود الغرفة</label>
        <input id="codeInput" type="text" inputmode="latin" placeholder="ABCD" maxlength="4" autocomplete="off" />
        <button id="joinBtn" class="btn mt">دخول</button>
        <p id="joinError" class="error" hidden></p>
      </div>
    </section>

    <!-- شاشة اللعب -->
    <section id="game" hidden>
      <div class="topbar">
        <span class="who">🙋 <span id="meName">—</span> <small>· غرفة <span id="roomCode">—</span></small></span>
        <span class="chip">نقاطك <strong id="myScore">0</strong></span>
      </div>

      <div class="card">
        <div class="question-box" id="question">استنى المضيف يبدأ الجولة…</div>
        <div class="status-line mt">
          <span class="chip" id="stateLabel" data-state="lobby">في الانتظار</span>
          <span class="chip" id="timerLabel"></span>
        </div>
      </div>

      <div class="card" id="playArea"></div>

      <button id="leaveBtn" class="btn ghost">خروج</button>
    </section>
  </main>
  <script type="module" src="./js/player.js"></script>
</body>
</html>
