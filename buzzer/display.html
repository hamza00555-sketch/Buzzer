<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16122b" />
  <link rel="icon" type="image/png" href="./img/logo.png" />
  <title>شاشة العرض — الأشبال</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="display-body">
  <!-- إدخال الكود -->
  <section id="join" class="wrap">
    <header class="brand">
      <h1 class="brand-title"><img class="brand-logo" src="./img/logo.png" alt="الأشبال" /></h1>
      <p class="sub">شاشة العرض — اعرضها على التلفزيون</p>
    </header>
    <div class="card">
      <label for="codeInput">كود الغرفة</label>
      <input id="codeInput" type="text" inputmode="latin" placeholder="ABCD" maxlength="4" autocomplete="off" />
      <button id="joinBtn" class="btn mt">اعرض</button>
      <p id="joinError" class="error" hidden></p>
      <p class="hint mt">تلميح: المضيف يقدر يفتح هذي الشاشة مباشرة بزر "افتح شاشة العرض".</p>
    </div>
  </section>

  <!-- المسرح -->
  <section id="stage" class="display-stage" hidden>
    <div id="confetti" class="confetti"></div>
    <header class="d-top">
      <img class="d-logo" src="./img/logo.png" alt="الأشبال" />
      <div class="d-room">
        <span class="d-room-label">كود الدخول</span>
        <span class="d-room-code" id="bigCode">----</span>
      </div>
      <div class="d-status">
        <span class="chip" id="phaseLabel" data-phase="lobby">بانتظار البدء</span>
        <span class="chip d-timer" id="timerLabel"></span>
        <span class="chip"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><path d="M16 4.6a3 3 0 0 1 0 5.8"/><path d="M21 20v-1a5 5 0 0 0-3-4.6"/></svg> <strong id="playerCount">0</strong></span>
      </div>
    </header>

    <div class="d-main">
      <div class="d-center">
        <h2 id="title"></h2>
        <div id="body"></div>
      </div>
      <aside id="board" class="d-board"></aside>
    </div>
  </section>

  <script type="module" src="./js/display.js"></script>
</body>
</html>
